<title>Prototyp drzewa zawodów</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Figtree:wght@400..800&display=swap">
<style>
/* Układ: kolumna telefonu, ilustrowane kafle w kolorach sześciu korzeni; kafel dwukolorowy = zawód wyrasta z dwóch korzeni. */
:root {
  color-scheme: light;
  --bg: #F4F5FA; --card: #FFFFFF; --wash: #E6E9F4; --ink: #141726; --muted: #5B6177; --faint: #878DA1; --line: #E1E4EF;
  --L: #3A66F5; --L-t: #E1E9FF; --L-d: #2346C4;
  --S: #8658F0; --S-t: #ECE5FF; --S-d: #6238CC;
  --P: #EE3F77; --P-t: #FFE1EA; --P-d: #BF1F56;
  --R: #F27A1A; --R-t: #FFE8D4; --R-d: #A84A04;
  --N: #1FA85A; --N-t: #DAF4E4; --N-d: #12733B;
  --O: #F2B50C; --O-t: #FFF0BF; --O-d: #7D5B00;
  --sh: 0 1px 2px rgba(20, 23, 38, 0.05), 0 6px 20px rgba(20, 23, 38, 0.06);
  --sh-img: drop-shadow(0 6px 8px rgba(20, 23, 38, 0.18));
  --frame: 0 30px 80px rgba(20, 23, 38, 0.2);
  --scrim: rgba(20, 23, 38, 0.4);
  --display: 'Bricolage Grotesque', 'Trebuchet MS', system-ui, sans-serif;
  --body: 'Figtree', system-ui, -apple-system, 'Segoe UI', sans-serif;
}
html, body { height: 100%; }
body { background: var(--wash); color: var(--ink); font-family: var(--body); font-size: 15px; line-height: 1.45; display: flex; justify-content: center; align-items: center; overflow: hidden; }
button, input { font: inherit; color: inherit; }
button { cursor: pointer; -webkit-tap-highlight-color: transparent; }
:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
h1, h2, h3, p, ul, ol { margin: 0; padding: 0; }
ul, ol { list-style: none; }
img { display: block; }

.app { position: relative; width: 100%; max-width: 430px; height: 100%; background: var(--bg); display: flex; flex-direction: column; overflow: hidden; }
@media (min-width: 520px) and (min-height: 720px) {
  .app { height: min(calc(100% - 32px), 880px); border-radius: 36px; box-shadow: var(--frame); }
}
.view { flex: 1; min-height: 0; overflow-y: auto; padding-bottom: 28px; display: flex; flex-direction: column; gap: 26px; }

h1 { font-family: var(--display); font-size: 28px; line-height: 32px; font-weight: 800; letter-spacing: -0.02em; text-wrap: balance; }
h2 { font-family: var(--display); font-size: 20px; line-height: 24px; font-weight: 700; letter-spacing: -0.01em; }
.eyebrow { font-size: 12px; line-height: 16px; font-weight: 700; letter-spacing: 0.07em; text-transform: uppercase; color: var(--muted); }
.small { font-size: 13px; line-height: 19px; color: var(--muted); }
.link { border: 0; background: none; padding: 0; font-weight: 700; color: var(--ink); text-decoration: underline; text-underline-offset: 3px; min-height: 24px; }

.hello { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; padding: 22px 16px 0; }
.hello > div { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.avatar { width: 48px; height: 48px; flex-shrink: 0; border: 0; padding: 0; border-radius: 24px; background: var(--O-t); display: grid; place-items: center; }
.avatar img { width: 36px; height: 36px; }

.view > *, .onb-scroll > * { flex-shrink: 0; }
.pm .card { min-width: 0; } .pm li, .card p, .mk dd, .skl span, .skl b { overflow-wrap: anywhere; } .pm li { hyphens: auto; }
.hero h1, .hero .hmeta { overflow-wrap: anywhere; }
.sec { display: flex; flex-direction: column; gap: 12px; padding-inline: 16px; }
.sec-h { display: flex; flex-direction: column; gap: 2px; }
.sec-h p { font-size: 14px; line-height: 20px; color: var(--muted); }
.grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.hscroll { display: flex; gap: 12px; overflow-x: auto; margin-inline: -16px; padding: 4px 16px 12px; scroll-snap-type: x proximity; scrollbar-width: none; }
.hscroll::-webkit-scrollbar { display: none; }
.hscroll > * { flex: 0 0 156px; scroll-snap-align: start; }
.list { display: flex; flex-direction: column; gap: 10px; }

.tile { display: grid; place-items: center; flex-shrink: 0; border-radius: 18px; background: linear-gradient(140deg, var(--a) 0 45%, var(--b) 100%); }
.tile img { width: 70%; height: 70%; object-fit: contain; filter: var(--sh-img); }

.rootcard { position: relative; min-height: 176px; border: 0; border-radius: 24px; padding: 14px; text-align: left; background: var(--t); overflow: hidden; display: flex; flex-direction: column; gap: 4px; }
.rootcard b { font-family: var(--display); font-size: 18px; line-height: 22px; font-weight: 700; }
.rootcard .tag { font-size: 13px; line-height: 17px; font-weight: 500; color: var(--d); }
.rootcard .cnt { margin-top: auto; font-size: 12px; line-height: 16px; font-weight: 700; color: var(--d); max-width: 72px; }
.rootcard img { position: absolute; right: 4px; bottom: 4px; width: 78px; height: 78px; filter: var(--sh-img); }

.areacard { border: 0; background: var(--card); border-radius: 22px; padding: 8px 8px 12px; text-align: left; display: flex; flex-direction: column; gap: 8px; box-shadow: var(--sh); min-width: 0; }
.areacard .tile { position: relative; height: 96px; border-radius: 16px; }
.areacard .tile img { width: 68px; height: 68px; }
.areacard .tile img.i2 { position: absolute; right: 8px; bottom: 6px; width: 34px; height: 34px; transform: rotate(10deg); }
.areacard .txt { display: flex; flex-direction: column; gap: 4px; padding-inline: 6px; min-width: 0; }
.areacard .name { font-size: 15px; line-height: 19px; font-weight: 700; overflow-wrap: anywhere; }
.areacard .meta { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; font-size: 12px; line-height: 16px; color: var(--muted); }
.dots { display: inline-flex; gap: 3px; }
.dots i { width: 8px; height: 8px; border-radius: 4px; background: var(--c); }

.fit { display: inline-flex; align-items: center; gap: 4px; height: 22px; padding: 0 8px 0 6px; border-radius: 11px; font-size: 12px; font-weight: 700; white-space: nowrap; }
.fit svg { width: 12px; height: 12px; fill: currentColor; }
.fit2 { background: var(--ink); color: var(--card); }
.fit1 { background: var(--card); color: var(--ink); box-shadow: inset 0 0 0 1.5px var(--ink); }
.full { display: inline-flex; align-items: center; height: 20px; padding: 0 8px; border-radius: 10px; font-size: 11px; font-weight: 700; background: var(--N-t); color: var(--N-d); white-space: nowrap; }

.rowi { width: 100%; box-sizing: border-box; border: 0; background: var(--card); border-radius: 20px; padding: 10px 12px 10px 10px; display: flex; align-items: center; gap: 12px; text-align: left; box-shadow: var(--sh); min-height: 76px; }
.rowi .tile { width: 56px; height: 56px; border-radius: 16px; }
.rowi .txt { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px; }
.rowi .name { font-size: 15px; line-height: 19px; font-weight: 700; overflow-wrap: anywhere; }
.rowi .sub { font-size: 13px; line-height: 17px; color: var(--muted); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.rowi .tags { display: flex; flex-wrap: wrap; gap: 6px; }
.rowi .chev { flex-shrink: 0; color: var(--faint); }
.ico { fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.more { min-height: 52px; border-radius: 18px; border: 2px dashed var(--line); background: transparent; font-weight: 700; color: var(--ink); }
.more span { font-weight: 500; color: var(--muted); }

.floatbar { position: sticky; top: 0; z-index: 5; height: 0; }
.fab { position: absolute; top: 14px; width: 44px; height: 44px; border: 0; padding: 0; border-radius: 22px; background: var(--card); box-shadow: var(--sh); display: grid; place-items: center; }
.fab.back { left: 16px; }
.fab.heart { right: 16px; }
.fab.heart[aria-pressed="true"] { color: var(--P); }
.fab.heart[aria-pressed="true"] svg { fill: currentColor; }

.hero { position: relative; margin-top: -26px; padding: 72px 16px 22px; background: linear-gradient(160deg, var(--a) 0 40%, var(--b) 100%); border-radius: 0 0 32px 32px; display: flex; flex-direction: column; gap: 6px; min-height: 124px; }
.hero > * { max-width: calc(100% - 116px); }
.hero h1.long { font-size: 22px; line-height: 26px; }
.hero .lead { font-size: 15px; line-height: 21px; font-weight: 500; color: var(--ink); }
.hero .hmeta { font-size: 13px; line-height: 18px; font-weight: 700; color: var(--muted); }
.hero-img { position: absolute; right: 14px; top: 62px; width: 108px; height: 108px; max-width: none; filter: var(--sh-img); }
.hero .chips { max-width: 100%; margin-top: 6px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { display: inline-flex; align-items: center; gap: 6px; min-height: 28px; box-sizing: border-box; padding: 4px 10px; border-radius: 14px; font-size: 13px; line-height: 18px; font-weight: 700; color: var(--d); background: var(--t); }
.hero .chip { background: var(--card); }
.chip.off { background: transparent; color: var(--muted); box-shadow: inset 0 0 0 1.5px var(--line); font-weight: 600; }
.chip i { width: 8px; height: 8px; border-radius: 4px; background: var(--c); flex-shrink: 0; }

.card { background: var(--card); border-radius: 22px; padding: 16px; box-shadow: var(--sh); display: flex; flex-direction: column; gap: 10px; }
.card p { font-size: 15px; line-height: 22px; text-wrap: pretty; }
.mk { gap: 14px; }
.mk .tag { align-self: flex-start; display: inline-flex; align-items: center; gap: 8px; min-height: 34px; padding: 4px 14px 4px 6px; border-radius: 17px; font-family: var(--display); font-size: 18px; line-height: 22px; font-weight: 700; background: var(--t); color: var(--d); }
.mk .tag img { width: 26px; height: 26px; }
.mk .tag.up { --t: var(--N-t); --d: var(--N-d); } .mk .tag.flat { --t: var(--L-t); --d: var(--L-d); } .mk .tag.down { --t: var(--R-t); --d: var(--R-d); } .mk .tag.none { --t: var(--wash); --d: var(--muted); }
.mk dl { margin: 0; display: flex; flex-direction: column; gap: 12px; }
.mk dt { font-size: 12px; line-height: 16px; font-weight: 700; letter-spacing: 0.07em; text-transform: uppercase; color: var(--muted); display: flex; align-items: center; gap: 8px; }
.mk dd { margin: 2px 0 0; font-size: 15px; line-height: 22px; text-wrap: pretty; }
.mk dd + dd { margin-top: 6px; }
.mk .lv { display: inline-flex; gap: 3px; } .mk .lv i { width: 14px; height: 6px; border-radius: 3px; background: var(--line); } .mk .lv i.on { background: var(--S); }
.mk .why { border-top: 1.5px solid var(--line); padding-top: 12px; }
.pay .amt { font-family: var(--display); font-size: 30px; line-height: 34px; font-weight: 700; letter-spacing: -0.01em; }
.pay .amt span { font-family: var(--body); font-size: 15px; font-weight: 600; color: var(--muted); letter-spacing: 0; }
.pay .track { position: relative; height: 12px; border-radius: 6px; background: var(--wash); }
.pay .track i { position: absolute; top: 0; bottom: 0; border-radius: 6px; background: var(--N); }
.pay .track u { position: absolute; top: -3px; bottom: -3px; width: 2px; background: var(--ink); border-radius: 1px; }
.pay .scale { display: flex; justify-content: space-between; font-size: 12px; line-height: 16px; color: var(--faint); font-weight: 600; }
.pay .cmp { font-size: 14px; line-height: 20px; color: var(--muted); }
.pay .cmp b { color: var(--N-d); }
.citybtn { align-self: flex-start; display: inline-flex; align-items: center; gap: 6px; min-height: 40px; padding: 0 14px 0 8px; border: 0; border-radius: 20px; background: var(--N-t); color: var(--N-d); font-size: 14px; font-weight: 700; }
.citybtn img { width: 24px; height: 24px; }
.cities { display: flex; flex-wrap: wrap; gap: 6px; }
.cities .pill { min-height: 36px; padding: 0 12px; font-size: 13px; box-shadow: inset 0 0 0 1.5px var(--line); }
.cities .pill[aria-pressed="true"] { box-shadow: none; }
.fitcard .top { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.fitcard .top b { font-family: var(--display); font-size: 18px; line-height: 22px; }
.prose { font-size: 16px; line-height: 24px; text-wrap: pretty; }
.checks { display: flex; flex-direction: column; gap: 10px; }
.checks li { display: grid; grid-template-columns: 24px 1fr; gap: 10px; font-size: 15px; line-height: 22px; }
.skl { display: flex; flex-direction: column; gap: 14px; }
.skl li { display: grid; grid-template-columns: 10px 1fr; gap: 12px; }
.skl li::before { content: ''; width: 10px; height: 10px; border-radius: 50%; background: var(--c, var(--N)); margin-top: 7px; }
.skl.nice li::before { background: transparent; box-shadow: inset 0 0 0 2.5px var(--c, var(--N)); }
.skl b { display: block; font-size: 16px; line-height: 22px; font-weight: 700; }
.skl span { display: block; font-size: 14px; line-height: 20px; color: var(--muted); text-wrap: pretty; }
.checks svg { width: 22px; height: 22px; color: var(--c, var(--N)); margin-top: 0; }
.day li { position: relative; display: grid; grid-template-columns: 50px 18px 1fr; column-gap: 8px; padding-bottom: 16px; font-size: 15px; line-height: 22px; }
.day li:last-child { padding-bottom: 0; }
.day li:not(:last-child)::before { content: ""; position: absolute; left: 66px; top: 18px; bottom: -4px; width: 2px; border-radius: 1px; background: var(--line); }
.day .t { text-align: right; font-size: 13px; font-weight: 800; color: var(--muted); font-variant-numeric: tabular-nums; }
.day .dot { width: 10px; height: 10px; border-radius: 5px; margin: 6px auto 0; background: var(--c); }
.pm { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.pm .card { padding: 14px; gap: 8px; }
.pm h3 { font-size: 13px; line-height: 18px; font-weight: 800; letter-spacing: 0.04em; text-transform: uppercase; }
.pm li { font-size: 14px; line-height: 19px; padding-left: 14px; position: relative; }
.pm li + li { margin-top: 8px; }
.pm li::before { content: ""; position: absolute; left: 0; top: 7px; width: 6px; height: 6px; border-radius: 3px; background: var(--c); }
.steps { display: flex; flex-direction: column; gap: 10px; counter-reset: s; }
.steps li { counter-increment: s; display: grid; grid-template-columns: 30px 1fr; gap: 12px; align-items: start; font-size: 15px; line-height: 22px; }
.steps li::before { content: counter(s); width: 30px; height: 30px; border-radius: 15px; background: var(--ink); color: var(--card); display: grid; place-items: center; font-size: 14px; font-weight: 800; }
.try { flex-direction: row; align-items: center; gap: 14px; background: var(--O-t); box-shadow: none; }
.try img { width: 56px; height: 56px; flex-shrink: 0; filter: var(--sh-img); }
.try b { display: block; font-size: 13px; line-height: 18px; font-weight: 800; letter-spacing: 0.04em; text-transform: uppercase; color: var(--O-d); }
.cta { flex-direction: row; align-items: center; gap: 14px; }
.cta img { width: 64px; height: 64px; flex-shrink: 0; filter: var(--sh-img); }
.cta .txt { display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.cta b { font-family: var(--display); font-size: 18px; line-height: 22px; }
.btn { min-height: 50px; border: 0; border-radius: 16px; padding: 0 20px; background: var(--ink); color: var(--card); font-size: 16px; font-weight: 700; }
.btn:disabled { background: var(--line); color: var(--muted); cursor: default; }
.btn.sm { min-height: 44px; font-size: 15px; align-self: flex-start; }
.btn.ghost { background: var(--card); color: var(--ink); box-shadow: inset 0 0 0 1.5px var(--ink); }
.skel { display: flex; flex-direction: column; gap: 10px; }
.skel i { display: block; height: 14px; border-radius: 7px; background: linear-gradient(90deg, var(--line) 0 40%, var(--bg) 50%, var(--line) 60% 100%); background-size: 300% 100%; animation: sh 1.4s linear infinite; }
@keyframes sh { from { background-position: 100% 0; } to { background-position: 0 0; } }
@media (prefers-reduced-motion: reduce) { .skel i { animation: none; } }
.specs { display: flex; flex-direction: column; gap: 8px; }
.specs details { background: var(--card); border-radius: 16px; box-shadow: var(--sh); }
.specs summary { min-height: 48px; box-sizing: border-box; display: flex; align-items: center; padding: 10px 14px; font-weight: 600; cursor: pointer; list-style: none; overflow-wrap: anywhere; }
.specs summary::-webkit-details-marker { display: none; }
.specs details p { padding: 0 14px 14px; font-size: 14px; line-height: 20px; color: var(--muted); }
.specs details.hit { box-shadow: inset 0 0 0 2px var(--ink); }
.field { width: 100%; height: 52px; box-sizing: border-box; border-radius: 18px; border: 1.5px solid var(--line); background: var(--card); padding: 0 16px; font-size: 16px; }
.field:focus { border-color: var(--ink); outline: none; }
.field::placeholder { color: var(--faint); }
.sugg { border: 0; min-height: 40px; padding: 0 14px; border-radius: 20px; background: var(--card); box-shadow: var(--sh); font-weight: 600; }

.banner { flex-direction: row; align-items: center; gap: 14px; background: var(--L-t); box-shadow: none; }
.banner img { width: 64px; height: 64px; flex-shrink: 0; filter: var(--sh-img); }
.banner .txt { display: flex; flex-direction: column; gap: 8px; }
.banner b { font-family: var(--display); font-size: 18px; line-height: 22px; }

.why li { display: grid; grid-template-columns: 44px 1fr; gap: 12px; align-items: center; }
.why li + li { margin-top: 12px; }
.why img { width: 40px; height: 40px; filter: var(--sh-img); }
.why b { display: block; font-size: 15px; line-height: 20px; }
.why span { font-size: 13px; line-height: 18px; color: var(--muted); }
.bars li { display: grid; grid-template-columns: 30px minmax(0, 1fr) 84px; gap: 10px; align-items: center; min-height: 36px; font-weight: 600; }
.bars img { width: 28px; height: 28px; }
.bars .seg { display: flex; gap: 4px; }
.bars .seg i { flex: 1; height: 10px; border-radius: 5px; background: var(--line); }
.bars .seg i.on { background: var(--c); }
.me-card { flex-direction: row; align-items: center; gap: 14px; }
.me-card .tile { width: 72px; height: 72px; border-radius: 24px; }
.me-card .txt { display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.me-card b { font-family: var(--display); font-size: 18px; line-height: 22px; }
.empty { border: 2px dashed var(--line); border-radius: 20px; padding: 18px 16px; font-size: 14px; line-height: 20px; color: var(--muted); }

.pills { display: flex; flex-wrap: wrap; gap: 8px; }
.pill { min-height: 40px; padding: 0 14px; border: 0; border-radius: 20px; background: var(--card); box-shadow: var(--sh); font-size: 14px; font-weight: 700; }
.pill[aria-pressed="true"] { background: var(--ink); color: var(--card); box-shadow: none; }
.path { display: flex; flex-direction: column; }
.st { position: relative; display: grid; grid-template-columns: 48px minmax(0, 1fr) auto; column-gap: 12px; align-items: start; padding-bottom: 18px; }
.st::before { content: ""; position: absolute; left: 23px; top: 50px; bottom: 2px; width: 2px; background: repeating-linear-gradient(to bottom, var(--line) 0 6px, transparent 6px 11px); }
.st.done::before { background: var(--N); }
.st:last-child { padding-bottom: 0; }
.st:last-child::before { display: none; }
.st .tile { width: 48px; height: 48px; border-radius: 16px; background: var(--t); }
.st.goal .tile { background: linear-gradient(140deg, var(--a) 0 45%, var(--b) 100%); }
.st .txt { display: flex; flex-direction: column; gap: 2px; padding-top: 3px; min-width: 0; }
.st .kind { font-size: 12px; line-height: 16px; font-weight: 800; color: var(--d); }
.st b { font-size: 15px; line-height: 20px; overflow-wrap: anywhere; }
.st.done b { color: var(--muted); }
.tick { width: 44px; height: 44px; border-radius: 22px; border: 2px solid var(--line); background: var(--card); display: grid; place-items: center; color: transparent; padding: 0; }
.tick[aria-pressed="true"] { background: var(--N); border-color: var(--N); color: var(--card); }
.tick:disabled { cursor: default; opacity: 0.6; }
.plan-sum { display: flex; align-items: center; gap: 14px; }
.plan-sum .tile { width: 64px; height: 64px; border-radius: 20px; }
.plan-sum .txt { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.plan-sum b { font-family: var(--display); font-size: 18px; line-height: 22px; overflow-wrap: anywhere; }
.plan-sum .grow { width: 52px; height: 52px; flex-shrink: 0; filter: var(--sh-img); }
.meter { display: flex; gap: 4px; }
.meter i { flex: 1; height: 8px; border-radius: 4px; background: var(--line); }
.meter i.on { background: var(--N); }
.next { background: var(--t); box-shadow: none; gap: 6px; }
.next b { font-family: var(--display); font-size: 19px; line-height: 24px; }
.next .eyebrow { color: var(--d); }
.next .btn { margin-top: 6px; }

.fbar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.fbtn { display: inline-flex; align-items: center; gap: 8px; min-height: 44px; padding: 0 16px 0 12px; border: 0; border-radius: 22px; background: var(--ink); color: var(--card); font-size: 15px; font-weight: 700; }
.fbtn img { width: 22px; height: 22px; }

    h += '<section class="sec"><div class="sec-h"><h2>Twoje korzenie</h2><p>Rosną, gdy zaznaczasz, co lubisz.</p></div><div class="card"><ul class="bars">' + [0, 1, 2, 3, 4, 5].sort(function (a, b) { return p[b] - p[a] || a - b; }).map(function (i) {
      return '<li style="--c:' + v(i) + '">' + img(ROOTS[i].i, '', 28) + '<span>' + ROOTS[i].n + '</span><span class="seg" role="img" aria-label="' + p[i] + ' z 3">' + [0, 1, 2].map(function (k) { return '<i' + (k < p[i] ? ' class="on"' : '') + '></i>'; }).join('') + '</span></li>';
    }).join('') + '</ul></div></section>';
    var favs = S.favs.map(function (k) { return BYNAME[k]; }).filter(Boolean);
    h += '<section class="sec"><h2>Obserwowane zawody</h2>' + (favs.length ? '<div class="list">' + favs.map(function (n) { return row(n, -1); }).join('') + '</div>' : '<div class="empty">Stuknij serce przy zawodzie, a pojawi się tutaj. Dzięki temu łatwo wrócisz do tego, co Cię zaciekawiło.</div>') + '</section>';
    h += '<section class="sec"><h2>O aplikacji</h2><p class="small">' + STATS.total + ' zawodów w ' + STATS.areas + ' kierunkach: klasyfikacja ESCO (Komisja Europejska) plus ' + (STATS.own || 0) + ' nowych zawodów dodanych ręcznie. Umiejętności, plusy, minusy i drogi kształcenia są rozpisane ręcznie dla ' + (STATS.groups || 0) + ' grup zawodów, a ' + STATS.detailed + ' zawodów ma własny pełny opis. Zadania i typowy dzień pozostałych zostały napisane z pomocą AI i nie były sprawdzane przez praktyków. Zarobki to szacunek: mediany GUS dla grup zawodów (październik 2024, przeliczone na 2025) i przeciętne płace w miastach wojewódzkich (GUS, marzec 2026); do zawodu trafia połowa różnicy między miastem a średnią krajową. Karta „Rynek pracy” pokazuje, czy sytuacja jest stabilna, według Barometru zawodów 2026; dotyczy grup zawodów, a nie pojedynczych stanowisk. Przypisanie zawodów do korzeni to pierwsze przybliżenie. Ilustracje: Fluent Emoji (Microsoft, licencja MIT). Wybory zapisują się tylko w tej przeglądarce.</p></section>';
    return h;
  }

  // ---- nawigacja ----
  function render(keepScroll) {
    var top = stack[stack.length - 1], view = $('view'), y = keepScroll ? view.scrollTop : (top.scroll || 0);
    REG = [];
    view.innerHTML = top.t === 'home' ? viewHome() : top.t === 'root' ? viewRoot(top.i) : top.t === 'node' ? viewNode(top.node) : top.t === 'job' ? viewJob(top.node, top.spec) : top.t === 'search' ? viewSearch() : top.t === 'plan' ? viewPlan() : viewMe();
    view.scrollTop = y;
    Array.prototype.forEach.call($('tabs').children, function (b) { if (b.dataset.tab === tab) b.setAttribute('aria-current', 'page'); else b.removeAttribute('aria-current'); });
    if (top.t === 'job') {
      var hit = view.querySelector('details.hit'); if (hit && !keepScroll && !top.scroll) hit.scrollIntoView({ block: 'center' });
      var key = top.node.fn || top.node.n;
      if (!top.node.x && !genGet(key) && !genStatus[key] && sampleState !== 'none') generate(top.node);
    }
  }
  function push(entry) { stack[stack.length - 1].scroll = $('view').scrollTop; stack.push(entry); render(); }
  function setTab(t) { tab = t; stack = [{ t: t }]; render(); if (t === 'search') { var q = $('q'); if (q && !lastQ) q.focus(); } }

  $('app').addEventListener('click', function (e) {
    var sg = e.target.closest('[data-sugg]');
    if (sg) { lastQ = sg.dataset.sugg; $('q').value = lastQ; REG = []; $('results').innerHTML = searchResults(lastQ); return; }
    var t = e.target.closest('[data-tab],[data-root],[data-ref],[data-act]'); if (!t || t.closest('#onb') || t.closest('#fsheet')) return;
    if (t.dataset.tab) return setTab(t.dataset.tab);
    if (t.dataset.root !== undefined) return push({ t: 'root', i: +t.dataset.root });
    if (t.dataset.ref !== undefined) { var r = REG[+t.dataset.ref]; return push(r.node.c ? { t: 'node', node: r.node } : { t: 'job', node: r.node, spec: r.spec }); }
    var top = stack[stack.length - 1], a = t.dataset.act;
    if (a === 'back') { if (stack.length > 1) { stack.pop(); render(); } }
    else if (a === 'more') { limits.set(top.node, (limits.get(top.node) || PAGE) + PAGE); render(true); }
    else if (a === 'edit') openOnb();
    else if (a === 'f-open') openSheet();
    else if (a === 'f-rm') { fset(t.dataset.g, t.dataset.v); render(true); }
    else if (a === 'f-clear') { S.f = {}; fv++; save(); render(true); }
    else if (a === 'fav') { var key = top.node.fn || top.node.n, i = S.favs.indexOf(key); if (i >= 0) S.favs.splice(i, 1); else S.favs.unshift(key); save(); render(true); }
    else if (a === 'city-toggle') { cityOpen = !cityOpen; render(true); }
    else if (a === 'city') { S.city = +t.dataset.i; cityOpen = false; save(); render(true); }
    else if (a === 'route') { jobRoute[top.node.fn || top.node.n] = +t.dataset.i; render(true); }
    else if (a === 'plan-add') { var k = top.node.fn || top.node.n, rs = routesOf(top.node) || [], rr = rs[Math.min(jobRoute[k] || 0, Math.max(rs.length - 1, 0))] || { n: '', s: [] }; S.plans.unshift({ job: k, name: rr.n, steps: rr.s, done: [] }); S.planSel = 0; save(); setTab('plan'); }
    else if (a === 'stage') { setStage(+t.dataset.i); render(true); }
    else if (a === 'search-more') { sLim.n += 30; $('results').innerHTML = searchResults(lastQ); }
    else if (a === 'plan-open') { S.planSel = Math.max(planFor(top.node.fn || top.node.n), 0); save(); setTab('plan'); }
    else if (top.t === 'plan') {
      var sel = Math.min(S.planSel || 0, S.plans.length - 1), plan = S.plans[sel], di = +t.dataset.i;
      if (a !== 'plan-del') confirmDel = false;
      if (a === 'step') { var at = plan.done.indexOf(di); if (at >= 0) plan.done.splice(at, 1); else plan.done.push(di); }
      else if (a === 'plan-sel') S.planSel = di;
      else if (a === 'plan-route') { var rs2 = routesOf(BYNAME[plan.job]) || []; if (rs2[di] && rs2[di].n !== plan.name) { plan.name = rs2[di].n; plan.steps = rs2[di].s; plan.done = []; } }
      else if (a === 'plan-del') { if (!confirmDel) confirmDel = true; else { S.plans.splice(sel, 1); S.planSel = 0; confirmDel = false; } }
      save(); render(true);
    }
  });
  $('fsheet').addEventListener('click', function (e) {
    if (e.target.id === 'fsheet') return closeSheet();
    var t = e.target.closest('[data-act]'); if (!t) return;
    var a = t.dataset.act;
    if (a === 'f-close') closeSheet();
    else if (a === 'f-clear') { S.f = {}; fv++; save(); refreshSheet(); }
    else if (a === 'f-set') { fset(t.dataset.g, t.dataset.v); refreshSheet(); }
    else if (a === 'stage') { setStage(+t.dataset.i); refreshSheet(); }
  });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && !$('fsheet').hidden) closeSheet(); });
  $('view').addEventListener('input', function (e) {
    if (e.target.id === 'q') { lastQ = e.target.value; REG = []; $('results').innerHTML = searchResults(lastQ); }
    if (e.target.id === 'specQ') { var q = norm(e.target.value.trim()); $('view').querySelectorAll('.specs details').forEach(function (d) { d.hidden = q !== '' && d.dataset.h.indexOf(q) < 0; }); }
  });

  // ---- opis pisany przez AI (capability: sample) ----
  var sampleState = 'unknown', sampleP = Promise.resolve(null);
  if (window.claude && typeof window.claude.use === 'function') {
    sampleP = window.claude.use('sample').then(function (s) { sampleState = s ? 'ready' : 'none'; return s; }, function () { sampleState = 'none'; return null; });
    sampleP.then(function () { if (sampleState === 'none') paintDetails(); });
  } else sampleState = 'none';
  function paintDetails() {
    var top = stack[stack.length - 1], box = $('details');
    if (top.t !== 'job' || !box) return;
    box.innerHTML = detailsBlock(top.node);
    var key = top.node.fn || top.node.n, x = genGet(key), prose = $('view').querySelector('.prose');
    if (x && x.hook && prose) prose.textContent = x.hook;
  }
  function tidy(x) {
    if (!x || typeof x !== 'object') return null;
    var arr = function (a, n) { return Array.isArray(a) ? a.slice(0, n) : []; };
    var o = {
      hook: typeof x.hook === 'string' ? x.hook : '', try: typeof x.try === 'string' ? x.try : '',
      tasks: arr(x.tasks, 5).filter(function (s) { return typeof s === 'string' && s.trim(); }),
      day: arr(x.day, 5).filter(function (p) { return Array.isArray(p) && p.length >= 2; }).map(function (p) { return [String(p[0]), String(p[1])]; })
    };
    return o.tasks.length || o.day.length ? o : null;
  }
  function promptFor(n) {
    var key = n.fn || n.n;
    return 'Jesteś doradcą zawodowym. Piszesz dla polskich nastolatków (15–18 lat): konkretnie, prosto, uczciwie, bez zachwalania.\n\n' +
      'Zawód: ' + key + '\nOpis zawodu: ' + (n.d || 'brak') + '\n' + (n.a && n.a.length ? 'Inne nazwy: ' + n.a.join(', ') + '\n' : '') + 'Miejsce w drzewie zawodów: ' + pathOf(n).map(function (x) { return x.n; }).join(' > ') + '\n\n' +
      'Odpowiedz wyłącznie jednym obiektem JSON o polach:\n' +
      '"hook": 1–2 zdania w 2. osobie o tym, na czym polega praca,\n"tasks": 4 krótkie czynności w 2. osobie,\n"day": 4 pary [godzina, co się wtedy dzieje] z realistycznego dnia pracy,\n' +
      '"try": jedno zadanie na dziś, do zrobienia w 15 minut bez wydawania pieniędzy.\n\n' +
      'Zasady: po polsku; każdy element ma najwyżej 14 słów; nie podawaj zarobków, statystyk ani nazw firm i uczelni; gdy nie masz pewności, pisz ogólniej zamiast zgadywać.\n' +
      'Kształt: {"hook":"…","tasks":["…"],"day":[["8:00","…"]],"try":"…"}';
  }
  function generate(n) {
    var key = n.fn || n.n;
    if (genStatus[key] && genStatus[key].state === 'loading') return;
    genStatus[key] = { state: 'loading' }; paintDetails();
    sampleP.then(function (sample) {
      if (!sample) { sampleState = 'none'; delete genStatus[key]; paintDetails(); return; }
      return sample.json(promptFor(n), { modelTier: 'quick', cache: { gcTime: 86400000 } }).then(function (raw) {
        var x = tidy(raw);
        if (!x) { genStatus[key] = { state: 'error', msg: 'Opis wyszedł niekompletny. Spróbuj jeszcze raz.' }; return; }
        GEN[key] = x; delete genStatus[key]; autoGen = true;
        try { localStorage.setItem('fa.gen.' + key, JSON.stringify(x)); } catch (e) {}
      }, function (err) {
        var code = err && err.code;
        if (['not_granted', 'sampling_disabled', 'not_declared', 'capability_disabled', 'capability_removed'].indexOf(code) >= 0) { sampleState = 'none'; delete genStatus[key]; }
        else genStatus[key] = { state: 'error', msg: code === 'rate_limited' ? 'Za dużo próśb naraz. Spróbuj za chwilę.' : code === 'session_expired' ? 'Sesja wygasła. Zaloguj się ponownie w Claude.' : 'Nie udało się napisać opisu. Spróbuj ponownie.' };
      });
    }).then(paintDetails);
  }

  // ---- start: co lubisz? ----
  var draft = [];
  function paintOnb() {
    $('picks').innerHTML = PICK_ORDER.map(function (i) {
      var it = INTERESTS[i], on = draft.indexOf(it[0]) >= 0;
      return '<button type="button" class="pick" data-id="' + it[0] + '" aria-pressed="' + on + '" style="--t:' + v(it[2], '-t') + '">' + img(it[3], '', 52) + '<span>' + it[1] + '</span><span class="ok" aria-hidden="true"><svg class="ico" width="14" height="14" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5" stroke-width="3"></path></svg></span></button>';
    }).join('');
    var left = 3 - draft.length;
    $('onbGo').disabled = left > 0;
    $('onbGo').textContent = left > 0 ? 'Wybierz jeszcze ' + left : 'Pokaż moje kierunki';
  }
  function openOnb() { draft = S.interests.slice(); paintOnb(); $('onb').hidden = false; $('onb').querySelector('.onb-scroll').scrollTop = 0; }
  function closeOnb(apply) {
    if (apply) S.interests = draft.slice();
    S.onboarded = true; save();
    $('onb').hidden = true; tab = 'home'; stack = [{ t: 'home' }]; render();
  }
  $('picks').addEventListener('click', function (e) {
    var b = e.target.closest('.pick'); if (!b) return;
    var id = b.dataset.id, i = draft.indexOf(id);
    if (i >= 0) draft.splice(i, 1); else draft.push(id);
    var y = $('onb').querySelector('.onb-scroll').scrollTop; paintOnb(); $('onb').querySelector('.onb-scroll').scrollTop = y;
    var again = $('picks').querySelector('[data-id="' + id + '"]'); if (again) again.focus();
  });
  $('onbGo').addEventListener('click', function () { closeOnb(true); });
  $('onbSkip').addEventListener('click', function () { closeOnb(false); });

  render();
  if (!S.onboarded) openOnb();
})();
</script>
